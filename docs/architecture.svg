<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Webamend architecture: the client's browser talks to the Webamend app; the app locks the repository on GitHub, runs an isolated agent container that edits a working tree, gates the result, pushes a branch, waits for a Netlify preview, and merges only when the client presses Publish.">
  <title>Webamend architecture</title>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h   { font-size: 16px; font-weight: 700; fill: #1F2328; }
    .h-a { fill: #A33E17; }
    .h-e { fill: #1C5A70; }
    .s   { font-size: 12.5px; fill: #57606A; }
    .l   { font-size: 12px; fill: #3B434B; }
    .l-a { fill: #A33E17; }
    .l-e { fill: #1C5A70; }
    .zone  { fill: #F3F1EA; stroke: #B9B3A6; stroke-width: 1; stroke-dasharray: 6 4; }
    .zl    { font-size: 11.5px; letter-spacing: 0.08em; fill: #8B8478; }
    .box   { fill: #FFFFFF; stroke: #1F2328; stroke-width: 1.4; }
    .soft  { fill: #FFFFFF; stroke: #B9B3A6; stroke-width: 1.2; }
    .agent { fill: #FBEDE3; stroke: #B5451B; stroke-width: 1.8; }
    .ext   { fill: #E9F1F5; stroke: #22667F; stroke-width: 1.4; }
    .ln    { fill: none; stroke: #1F2328; stroke-width: 1.5; }
    .ln-a  { fill: none; stroke: #B5451B; stroke-width: 1.7; }
    .ln-e  { fill: none; stroke: #22667F; stroke-width: 1.5; }
    .ln-d  { fill: none; stroke: #6E7681; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .badge { fill: #1F2328; }
    .bt    { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="a"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5451B"/></marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22667F"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7681"/></marker>
  </defs>

  <rect width="1200" height="620" fill="#FBFAF7"/>

  <!-- Installation zone -->
  <rect x="320" y="60" width="520" height="500" rx="6" class="zone"/>
  <text x="340" y="86" class="sans zl">WEBAMEND INSTALLATION · ONE SITE</text>

  <!-- Client -->
  <rect x="50" y="200" width="200" height="90" rx="5" class="box"/>
  <text x="70" y="232" class="sans h">Client</text>
  <text x="70" y="256" class="sans s">chat · preview · Publish</text>

  <!-- App -->
  <rect x="360" y="180" width="240" height="120" rx="5" class="box"/>
  <text x="380" y="212" class="sans h">Webamend app</text>
  <text x="380" y="236" class="sans s">one Next.js process</text>
  <text x="380" y="256" class="sans s">holds every credential</text>
  <text x="380" y="276" class="sans s">no database</text>

  <!-- Working tree -->
  <rect x="360" y="410" width="240" height="100" rx="5" class="soft"/>
  <text x="380" y="442" class="sans h">Working tree</text>
  <text x="380" y="466" class="sans s">temporary copy of the site</text>
  <text x="380" y="486" class="sans s">no remote · no token</text>

  <!-- Agent container -->
  <rect x="620" y="410" width="200" height="100" rx="5" class="agent"/>
  <text x="640" y="442" class="sans h h-a">Agent container</text>
  <text x="640" y="466" class="sans s">edits files, nothing else</text>
  <text x="640" y="486" class="sans s">no git · no credentials</text>

  <!-- Email -->
  <rect x="900" y="40" width="260" height="70" rx="5" class="ext"/>
  <text x="920" y="68" class="sans h h-e">Email</text>
  <text x="920" y="92" class="sans s">sign-in links · alerts</text>

  <!-- GitHub -->
  <rect x="900" y="150" width="260" height="120" rx="5" class="ext"/>
  <text x="920" y="182" class="sans h h-e">GitHub</text>
  <text x="920" y="206" class="sans s">the client's repository</text>
  <text x="920" y="226" class="sans s">branch + pull request = conversation</text>
  <text x="920" y="246" class="sans s">comments = history</text>

  <!-- Netlify -->
  <rect x="900" y="320" width="260" height="90" rx="5" class="ext"/>
  <text x="920" y="352" class="sans h h-e">Netlify</text>
  <text x="920" y="376" class="sans s">preview per pull request</text>
  <text x="920" y="396" class="sans s">live site on merge</text>

  <!-- OpenRouter -->
  <rect x="900" y="450" width="260" height="70" rx="5" class="ext"/>
  <text x="920" y="478" class="sans h h-e">OpenRouter</text>
  <text x="920" y="502" class="sans s">the model</text>

  <!-- 1 client -> app -->
  <line x1="250" y1="225" x2="360" y2="225" class="ln" marker-end="url(#a)"/>
  <circle cx="290" cy="225" r="11" class="badge"/><text x="290" y="229" class="sans bt" text-anchor="middle">1</text>
  <text x="305" y="215" class="sans l">request</text>

  <!-- 6 app -> client -->
  <line x1="360" y1="270" x2="250" y2="270" class="ln" marker-end="url(#a)"/>
  <circle cx="290" cy="270" r="11" class="badge"/><text x="290" y="274" class="sans bt" text-anchor="middle">6</text>
  <text x="305" y="290" class="sans l">preview</text>

  <!-- app -> email -->
  <path d="M560,180 L560,75 L900,75" class="ln-e" marker-end="url(#ae)"/>
  <text x="600" y="93" class="sans l l-e">sign-in links</text>

  <!-- 2 app -> GitHub -->
  <path d="M600,200 L900,200" class="ln-e" marker-end="url(#ae)"/>
  <circle cx="640" cy="200" r="11" class="badge"/><text x="640" y="204" class="sans bt" text-anchor="middle">2</text>
  <text x="660" y="193" class="sans l l-e">lock · read config</text>

  <!-- 5 / 7 app -> GitHub -->
  <path d="M600,240 L900,240" class="ln-e" marker-end="url(#ae)"/>
  <circle cx="640" cy="240" r="11" class="badge"/><text x="640" y="244" class="sans bt" text-anchor="middle">5</text>
  <text x="660" y="233" class="sans l l-e">push branch</text>
  <circle cx="780" cy="240" r="11" class="badge"/><text x="780" y="244" class="sans bt" text-anchor="middle">7</text>
  <text x="800" y="233" class="sans l l-e">merge on Publish</text>

  <!-- 3 app -> agent -->
  <path d="M600,280 L720,280 L720,410" class="ln-a" marker-end="url(#aa)"/>
  <circle cx="720" cy="330" r="11" class="badge"/><text x="720" y="334" class="sans bt" text-anchor="middle">3</text>
  <text x="738" y="334" class="sans l l-a">start · destroy</text>

  <!-- 4 app -> working tree -->
  <line x1="480" y1="300" x2="480" y2="410" class="ln" marker-end="url(#a)"/>
  <circle cx="480" cy="350" r="11" class="badge"/><text x="480" y="354" class="sans bt" text-anchor="middle">4</text>
  <text x="498" y="354" class="sans l">gate the change</text>

  <!-- tree <-> agent -->
  <line x1="600" y1="450" x2="620" y2="450" class="ln-a" marker-end="url(#aa)"/>
  <line x1="620" y1="475" x2="600" y2="475" class="ln-a" marker-end="url(#aa)"/>

  <!-- agent -> OpenRouter -->
  <line x1="820" y1="485" x2="900" y2="485" class="ln-a" marker-end="url(#aa)"/>

  <!-- 6 Netlify -> app -->
  <path d="M900,365 L640,365 L640,300" class="ln-e" marker-end="url(#ae)"/>
  <circle cx="770" cy="365" r="11" class="badge"/><text x="770" y="369" class="sans bt" text-anchor="middle">6</text>
  <text x="790" y="358" class="sans l l-e">preview ready</text>

  <!-- GitHub -> Netlify -->
  <path d="M1030,270 L1030,320" class="ln-d" marker-end="url(#ad)"/>
  <text x="1042" y="299" class="sans l">builds</text>

  <!-- Legend -->
  <line x1="340" y1="540" x2="360" y2="540" class="ln"/><text x="368" y="544" class="sans l">host, trusted</text>
  <line x1="470" y1="540" x2="490" y2="540" class="ln-a"/><text x="498" y="544" class="sans l l-a">agent, untrusted</text>
  <line x1="620" y1="540" x2="640" y2="540" class="ln-e"/><text x="648" y="544" class="sans l l-e">outside service</text>
</svg>
